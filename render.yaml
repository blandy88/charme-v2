databases:
  - name: parfumerie-charme-db
    plan: free
    databaseName: parfumerie_charme
    user: parfumerie_charme

services:
  - type: web
    name: parfumerie-charme
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm run init-db && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://charmeperfume.me,https://www.charmeperfume.me
      - key: ALLOW_UNVERIFIED_LOGIN
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: parfumerie-charme-db
          property: connectionString
