name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp styles.css _site/
          cp script.js _site/
          cp -r js _site/
          cp -r css _site/
          cp -r images _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true
          cp *.png _site/ 2>/dev/null || true
          cp *.jpg _site/ 2>/dev/null || true
          cp *.svg _site/ 2>/dev/null || true
          cp *.webp _site/ 2>/dev/null || true
          cp CNAME _site/ 2>/dev/null || true
          cp favicon.ico _site/ 2>/dev/null || true
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
